{% extends 'mailing/mailing_base.html' %}
{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row mt-5 justify-content-center">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">ФИО получателя: {{ recipient.full_name }}</p>
              <p class="card-text">Email: {{ recipient.full_name }}</p>
              <p class="card-text">Комментарий: {{ recipient.comment }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailing:recipient_list' %}" role="button">Назад</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailing:recipient_update' recipient.pk %}" role="button">Редактировать</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'mailing:recipient_delete' recipient.pk %}" role="button">Удалить</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
