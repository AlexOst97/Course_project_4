{% extends 'mailing/mailing_base.html' %}
{% block content %}

<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row-cols-md-3 g-3">
        {% for user in users %}
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">{{ user.last_name }} {{ user.first_name }} - {{ user.email }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'users:user_detail' user.pk %}" role="button">Просмотр</a>
                </div>
                <small class="text-body-secondary"></small>
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
{% endblock %}
