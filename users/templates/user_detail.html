{% extends 'mailing/mailing_base.html' %}
{% block content %}


<div class="album py-5 bg-body-tertiary">
    <div class="container">
      <div class="row mt-5 justify-content-center">
        <div class="col">
          <div class="card shadow-sm">
            <div class="card-body">
              <p class="card-text">Фамилия: {{ user.last_name }}</p>
              <p class="card-text">Имя: {{ user.first_name }}</p>
              <p class="card-text">Электронная почта: {{ user.email }}</p>
              <p class="card-text">Номер телефона: {{ user.phone_number }}</p>
              <p class="card-text">Страна: {{ user.country }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <div class="btn-group">
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'users:user_list' %}" role="button">Назад</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'users:user_update' user.pk %}" role="button">Редактировать</a>
                  <a class="btn btn-sm btn-outline-secondary" href="{% url 'users:user_delete' user.pk %}" role="button">Удалить</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
